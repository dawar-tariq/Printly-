plugins { id 'com.android.application' }

android {
    namespace 'io.github.dawartariq.printly.owner'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.dawartariq.printly.owner'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.1-review'
        // Increase versionCode for every native APK release. Website-only
        // changes do not require a new APK. Keep the origin in sync with DAL.
        resValue 'string', 'launch_url', "https://printly-steel-three.vercel.app/owner-app?android_version=${versionCode}"
    }

    def storePath = System.getenv('PRINTLY_ANDROID_KEYSTORE_PATH')
    def storePasswordValue = System.getenv('PRINTLY_ANDROID_KEYSTORE_PASSWORD')
    def storeTypeValue = System.getenv('PRINTLY_ANDROID_KEYSTORE_TYPE')
    def keyAliasValue = System.getenv('PRINTLY_ANDROID_KEY_ALIAS')
    def keyPasswordValue = System.getenv('PRINTLY_ANDROID_KEY_PASSWORD')
    if (storeTypeValue && !(storeTypeValue in ['JKS', 'PKCS12'])) {
        throw new GradleException('PRINTLY_ANDROID_KEYSTORE_TYPE must be JKS or PKCS12 when supplied.')
    }
    def releaseSigningReady = [storePath, storePasswordValue, keyAliasValue, keyPasswordValue].every { it != null && !it.isEmpty() }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(storePath)
                storePassword storePasswordValue
                if (storeTypeValue) storeType storeTypeValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes {
        // Test APKs cannot overwrite or impersonate a release installation.
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }
    gradle.taskGraph.whenReady { graph ->
        if (!releaseSigningReady && graph.allTasks.any { it.path.startsWith(':app:') && it.name in ['assembleRelease', 'bundleRelease', 'packageRelease'] }) {
            throw new GradleException('Release signing is not configured. Set all four PRINTLY_ANDROID_KEYSTORE_* / KEY_* variables before building a release.')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
