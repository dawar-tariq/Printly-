name: One-time production token notification test
on:
  push:
    branches: ['arena/309fdf51-printly']
    paths: ['scripts/native-production-once-trigger.txt']
permissions:
  id-token: write
  contents: read
jobs:
  once:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invoke single-use sender
        shell: bash
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=printly-production-token-test-810af132" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          curl --fail-with-body --silent --show-error --max-time 60 --request POST -H "Authorization: Bearer $token" https://printly0.vercel.app/api/cron/native-production-once
