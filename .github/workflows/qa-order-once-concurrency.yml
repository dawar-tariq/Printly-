# TEMPORARY: synthetic local PostgreSQL only; no secrets or hosted connections.
name: Rehearse isolated QA order one-shot concurrency
on:
  workflow_dispatch:
  push:
    branches: ['arena/309fdf51-printly']
    paths: ['.github/workflows/qa-order-once-concurrency.yml']
permissions:
  contents: read
jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Exercise real local PostgreSQL concurrency
        shell: bash
        run: |
          set -euo pipefail
          PRINTLY_PG_BIN="$(pg_config --bindir)" node scripts/test-qa-order-once-concurrency.mjs
