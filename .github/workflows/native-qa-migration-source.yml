# Temporary one-shot transport of the public, hash-pinned 0027 SQL into the
# isolated staging database. It never applies SQL or sends a notification.
name: Stage reviewed isolated QA migration source

on:
  push:
    branches: ['arena/309fdf51-printly']
    paths: ['.github/workflows/native-qa-migration-source.yml']

permissions: {}

jobs:
  stage-source:
    if: github.repository == 'dawar-tariq/Printly-' && github.ref == 'refs/heads/arena/309fdf51-printly'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verify isolation and store reviewed source without delivery
        env:
          QA_WORKER_SECRET: ${{ secrets.PRINTLY_QA_CRON_E54FF1CB5D3D }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const site = 'https://printly-native-test.vercel.app';
          const expectedDb = 'https://rahfmpsdbwbktlobntkm.supabase.co';
          const secret = process.env.QA_WORKER_SECRET || '';
          const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
          if (!/^[A-Za-z0-9_-]{32,128}$/.test(secret)) fail('QA authorization is not configured.');
          try {
            const diagnostic = await fetch(`${site}/api/native/v1/test-environment`, { redirect: 'error', signal: AbortSignal.timeout(15000) });
            const result = await diagnostic.json();
            if (!diagnostic.ok || result.isolated_test !== true || result.supabase_url !== expectedDb || result.public_auth_check !== 'ok' || result.server_database_read !== 'ok') fail('Isolated staging verification failed.');
          } catch { fail('Could not verify the isolated staging environment.'); }
          const path = `${site}/api/native/v1/qa-migration-source`;
          const wrong = `${secret[0] === 'A' ? 'B' : 'A'}${secret.slice(1)}`;
          const deadline = Date.now() + 7 * 60 * 1000;
          try {
            let status = 404;
            while (Date.now() < deadline && (status === 404 || status === 405)) {
              const denied = await fetch(path, { method: 'POST', headers: { authorization: `Bearer ${wrong}` }, redirect: 'error', signal: AbortSignal.timeout(15000) });
              status = denied.status;
              if (status === 404 || status === 405) await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            if (status !== 401) fail(`Source transport authorization check returned HTTP ${status}.`);
            const response = await fetch(path, { method: 'POST', headers: { authorization: `Bearer ${secret}` }, redirect: 'error', signal: AbortSignal.timeout(30000) });
            const result = await response.json();
            if (!response.ok || result.staged !== true) fail(`Source transport failed (HTTP ${response.status}).`);
            console.log('PASS: reviewed SQL source stored only in isolated staging. No SQL was applied and no notification was sent.');
          } catch { fail('Could not stage the migration source securely.'); }
          NODE
