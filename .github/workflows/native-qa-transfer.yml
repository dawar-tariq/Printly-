# Temporary one-run transport for the isolated, debug-signed QA APK. The
# workspace cannot reach the Actions artifact host. This creates an unreferenced
# Git blob (not a branch or release) so its bytes can be independently checked.
# The APK contains no Supabase or signing secrets and is NEVER a release.
name: Retrieve isolated native QA

on:
  push:
    paths:
      - '.github/workflows/native-qa-transfer.yml'

permissions: {}

jobs:
  transfer-qa:
    if: github.ref == 'refs/heads/arena/309fdf51-printly'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and transfer the successful isolated QA artifact
        shell: bash
        run: |
          set -euo pipefail
          run_id=45609262968
          artifact_id=15020041784
          expected_digest=38c8d80833b2762aa588d461be85ef7d17d2ba3e39fb35bad18eed308b332e7d
          source_sha=cf851ac188941c1a09dd39565e1b60b988146229
          run_info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '[.status,.conclusion,.head_sha,.head_branch] | join(" ")')
          test "$run_info" = "completed success $source_sha arena/309fdf51-printly"
          artifact_info=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" --jq '[.name,.expired,(.digest // ""),(.workflow_run.id|tostring),.workflow_run.head_sha] | join(" ")')
          test "$artifact_info" = "printly-native-QA-isolated-test-NOT-FOR-RELEASE false sha256:$expected_digest $run_id $source_sha"
          zip="$RUNNER_TEMP/native-qa.zip"
          apk="$RUNNER_TEMP/native-qa.apk"
          dex="$RUNNER_TEMP/native-qa.dex"
          blob="$RUNNER_TEMP/git-blob.json"
          trap 'rm -f "$zip" "$apk" "$dex" "$blob"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$zip"
          echo "$expected_digest  $zip" | sha256sum -c -
          test "$(unzip -Z1 "$zip")" = 'app-qa.apk'
          unzip -p "$zip" app-qa.apk > "$apk"
          test -s "$apk"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          test "$status" -eq 0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0' > /dev/null
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$analyzer" manifest application-id "$apk")" = 'io.github.dawartariq.printly.owner.native.qa'
          test "$("$analyzer" manifest version-code "$apk")" = '4'
          test "$("$analyzer" manifest version-name "$apk")" = '2.0.1-isolated-test'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/native-qa-badging.txt"
          grep -F "application-label:'Printly Isolated Test'" "$RUNNER_TEMP/native-qa-badging.txt"
          grep -F 'application-debuggable' "$RUNNER_TEMP/native-qa-badging.txt"
          signature=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$signature"
          printf '%s\n' "$signature" | grep -Fx 'Number of signers: 1'
          cert_sha=$(printf '%s\n' "$signature" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "${#cert_sha}" -eq 64
          unzip -p "$apk" 'classes*.dex' > "$dex"
          grep -aqF 'https://printly-native-test.vercel.app' "$dex"
          grep -aqF 'rahfmpsdbwbktlobntkm.supabase.co' "$dex"
          if grep -aqF 'printly-steel-three.vercel.app' "$dex" || grep -aqF 'lgfqetnfazawglwllymb.supabase.co' "$dex"; then
            echo 'Production host found in QA package.' >&2; exit 1
          fi
          if grep -aqE 'sb_secret_[A-Za-z0-9_-]{16,}' "$dex"; then
            echo 'A secret-like key was found in the QA package.' >&2; exit 1
          fi
          apk_sha=$(sha256sum "$apk" | cut -d' ' -f1)
          git_sha=$(git hash-object "$apk")
          python3 - "$apk" "$blob" <<'PY'
          import base64, json, sys
          with open(sys.argv[1], 'rb') as source, open(sys.argv[2], 'w', encoding='utf-8') as target:
              json.dump({'encoding': 'base64', 'content': base64.b64encode(source.read()).decode('ascii')}, target)
          PY
          api_sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$blob" --jq .sha)
          test "$api_sha" = "$git_sha"
          echo "::notice title=Isolated native QA transfer::blob_sha=$api_sha apk_sha256=$apk_sha certificate_sha256=$cert_sha source_run=$run_id version=2.0.1-isolated-test code=4 (debug-signed, not a release)"
