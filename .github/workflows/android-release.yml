name: Android protected signed review

# A deliberate request-file change works on this branch without merging to main.
# The job still requires a protected environment and human approval. Manual
# dispatch becomes available only after this workflow exists on the default branch.
# Neither trigger publishes the APK or deploys the website.
on:
  workflow_dispatch:
    inputs:
      expected_certificate_sha256:
        description: 'Independently verified release certificate SHA-256 fingerprint'
        required: true
        type: string
  push:
    branches:
      - 'arena/309fdf51-printly'
    paths:
      - 'apps/printly-owner-android/signed-review-request.json'

permissions:
  actions: read
  contents: read

concurrency:
  group: android-owner-signed-review
  cancel-in-progress: false

jobs:
  verify-protection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check signing-environment protections before requesting approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-android-signing-environment.mjs

  signed-review:
    needs: verify-protection
    # Environment secrets are available only after its rules and review pass.
    environment: printly-owner-signing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Recheck protections and the approved commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu -o pipefail
          node scripts/check-android-signing-environment.mjs
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate the explicit review request
        id: request
        working-directory: apps/printly-owner-android
        shell: bash
        run: |
          set -eu -o pipefail
          test -f signed-review-request.json
          jq -e 'type == "object" and .purpose == "signed-review-only" and
            .package == "io.github.dawartariq.printly.owner" and
            (.request_id | type == "string" and test("^[A-Za-z0-9._-]{8,80}$")) and
            (.version_code | type == "number" and . >= 1 and . <= 2100000000 and . == floor)' signed-review-request.json > /dev/null
          echo "version_code=$(jq -r .version_code signed-review-request.json)" >> "$GITHUB_OUTPUT"
          echo "::notice title=Review build::Review-only APK requested from commit $GITHUB_SHA; this does not publish or deploy."
      # Fail before touching the signing key if the configured artifact
      # passphrase or GnuPG setup cannot encrypt and decrypt harmless data.
      - name: Verify review encryption with harmless data
        working-directory: apps/printly-owner-android
        shell: bash
        env:
          PRINTLY_ANDROID_ARTIFACT_PASSPHRASE: ${{ secrets.PRINTLY_ANDROID_ARTIFACT_PASSPHRASE }}
        run: |
          set -eu -o pipefail
          umask 077
          SAMPLE=$(mktemp "$RUNNER_TEMP/printly-review-check.XXXXXXXX")
          ENCRYPTED="$SAMPLE.gpg"
          ROUNDTRIP="$SAMPLE.roundtrip"
          CHECK_HOME=$(mktemp -d "$RUNNER_TEMP/printly-review-check-home.XXXXXXXX")
          export GNUPGHOME="$CHECK_HOME"
          trap 'gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$CHECK_HOME"; rm -f "$SAMPLE" "$ENCRYPTED" "$ROUNDTRIP"' EXIT
          printf '%s\n' 'Disposable review encryption check' > "$SAMPLE"
          ../../scripts/encrypt-android-review.sh "$SAMPLE" "$ENCRYPTED"
          passphrase=${PRINTLY_ANDROID_ARTIFACT_PASSPHRASE:-}
          while [[ "$passphrase" == *$'\n' || "$passphrase" == *$'\r' ]]; do passphrase=${passphrase%?}; done
          if ! printf '%s\n' "$passphrase" | gpg --batch --yes --pinentry-mode loopback --no-symkey-cache --passphrase-fd 0 --decrypt "$ENCRYPTED" > "$ROUNDTRIP" 2>/dev/null; then
            echo '::error title=Review encryption check::The sample artifact could not be decrypted on the runner.'
            exit 1
          fi
          unset passphrase PRINTLY_ANDROID_ARTIFACT_PASSPHRASE
          if ! cmp -s "$SAMPLE" "$ROUNDTRIP"; then
            echo '::error title=Review encryption check::The sample artifact did not round-trip correctly.'
            exit 1
          fi
          echo '::notice title=Review encryption check::A harmless sample encrypted and decrypted successfully.'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          result=${PIPESTATUS[1]}
          set -o pipefail
          test "$result" -eq 0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Sign and independently verify the APK
        working-directory: apps/printly-owner-android
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PRINTLY_ANDROID_KEYSTORE_BASE64 }}
          PRINTLY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PRINTLY_ANDROID_KEYSTORE_PASSWORD }}
          EXPECTED_CERTIFICATE: ${{ vars.PRINTLY_ANDROID_EXPECTED_CERT_SHA256 }}
          MANUAL_EXPECTED_CERTIFICATE: ${{ inputs.expected_certificate_sha256 }}
          REQUESTED_VERSION_CODE: ${{ steps.request.outputs.version_code }}
        run: ../../scripts/sign-android-review.sh
      - name: Encrypt the review APK for the operator
        working-directory: apps/printly-owner-android
        shell: bash
        env:
          PRINTLY_ANDROID_ARTIFACT_PASSPHRASE: ${{ secrets.PRINTLY_ANDROID_ARTIFACT_PASSPHRASE }}
        run: |
          set -eu -o pipefail
          ../../scripts/encrypt-android-review.sh app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release.apk.gpg
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          # Only the encrypted APK and public evidence are uploaded. GitHub
          # artifacts in this public repository are not private storage.
          name: printly-owner-signed-review-encrypted
          path: |
            apps/printly-owner-android/app/build/outputs/apk/release/app-release.apk.gpg
            apps/printly-owner-android/signer-evidence.txt
            apps/printly-owner-android/package-evidence.txt
            apps/printly-owner-android/sha256-evidence.txt
          if-no-files-found: error
          retention-days: 7
