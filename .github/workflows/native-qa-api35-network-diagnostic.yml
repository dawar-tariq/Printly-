# TEMPORARY, no app installation or test accounts: inspect how an isolated
# disposable CI emulator reports its default network before/after radio off.
name: Diagnose disposable Android 35 emulator networking

on:
  push:
    branches: ['arena/309fdf51-printly']
    paths: ['.github/workflows/native-qa-api35-network-diagnostic.yml']

permissions: {}

jobs:
  diagnose:
    if: github.repository == 'dawar-tariq/Printly-' && github.ref == 'refs/heads/arena/309fdf51-printly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Inspect network state on a fresh disposable API 35 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            bash -euo pipefail <<'BASH'
            listing=$(adb devices | tr -d '\r')
            mapfile -t devices < <(printf '%s\n' "$listing" | awk 'NR > 1 && NF { print $1 " " $2 }')
            [[ ${#devices[@]} -eq 1 && "${devices[0]}" =~ ^emulator-[0-9]+\ device$ ]]
            export ANDROID_SERIAL=${devices[0]%% *}
            qemu=$(adb shell getprop ro.kernel.qemu | tr -d '\r')
            [[ "$qemu" == 1 ]]
            [[ "$(adb shell am get-current-user | tr -d '\r')" == 0 ]]
            adb shell dumpsys connectivity > "$RUNNER_TEMP/connectivity-before.txt"
            adb shell svc wifi disable
            adb shell svc data disable
            sleep 12
            adb shell dumpsys connectivity > "$RUNNER_TEMP/connectivity-radios-off.txt"
            airplane=supported
            adb shell cmd connectivity airplane-mode enable > /dev/null 2>&1 || airplane=unsupported
            adb shell svc wifi disable
            adb shell svc data disable
            sleep 12
            adb shell dumpsys connectivity > "$RUNNER_TEMP/connectivity-airplane.txt"
            AIRPLANE_COMMAND="$airplane" python3 - <<'PY'
            import os, re
            from pathlib import Path
            root = Path(os.environ['RUNNER_TEMP'])
            # Only enum-like network classes and the synthetic network ID are
            # emitted; no addresses, Wi-Fi names, app names or raw dumps.
            for name in ('before', 'radios-off', 'airplane'):
                text = (root / ('connectivity-' + name + '.txt')).read_text(errors='replace')
                m = re.search(r'Active default network:\s*(\S+)', text, re.I)
                default = m.group(1) if m and re.fullmatch(r'\d+|none|null', m.group(1), re.I) else 'unknown'
                transports = set()
                for line in text.splitlines():
                    if 'NetworkAgentInfo' in line and (default == 'unknown' or re.search(r'network\{' + re.escape(default) + r'\}', line)):
                        transports.update(re.findall(r'\b(?:WIFI|CELLULAR|ETHERNET|VPN|BLUETOOTH|WIFI_AWARE|LOWPAN|USB)\b', line))
                classes = ','.join(sorted(transports)) if transports else 'none_or_unparsed'
                print(f'::notice title=Disposable emulator network::{name}: default={default}, classes={classes}')
            print(f"::notice title=Disposable emulator network::airplane command: {os.environ['AIRPLANE_COMMAND']}")
            PY
            BASH
