# TEMPORARY: run only the isolated QA first-open permission check on a fresh,
# network-disabled CI emulator. No notification, signing or release is made.
name: Recheck offline Android notification permission

on:
  push:
    branches: ['arena/309fdf51-printly']
    paths: ['.github/workflows/native-qa-api35-permission-recheck.yml']

permissions:
  contents: read

jobs:
  recheck:
    if: github.repository == 'dawar-tariq/Printly-' && github.ref == 'refs/heads/arena/309fdf51-printly'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify disposable-emulator safety using synthetic mocks
        run: node --test scripts/test-native-emulator-check.test.mjs
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          test "$status" -eq 0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build isolated QA app and instrumentation
        working-directory: apps/printly-owner-native-android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon testQaUnitTest assembleQa assembleQaAndroidTest --stacktrace \
            '-PprintlyQaSiteOrigin=https://printly-native-test.vercel.app' \
            '-PprintlyInstrumentationBuildType=qa' > "$RUNNER_TEMP/native-permission-qa-build.log" 2>&1
          result=$?
          tail -n 100 "$RUNNER_TEMP/native-permission-qa-build.log"
          if [ "$result" -ne 0 ]; then
            lines=$(grep -E '(^e: |^FAILURE:|^\* What went wrong|^> |^   > |^Caused by:|error:| FAILED)' "$RUNNER_TEMP/native-permission-qa-build.log" | grep -v '^> Task ' | head -50 || true)
            if [ -z "$lines" ]; then lines=$(tail -n 40 "$RUNNER_TEMP/native-permission-qa-build.log"); fi
            lines=${lines//'%'/'%25'}; lines=${lines//$'\r'/'%0D'}; lines=${lines//$'\n'/'%0A'}
            echo "::error title=Isolated QA build::$lines"
          fi
          exit "$result"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the first-open permission flow on a disposable offline API 35 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: apps/printly-owner-native-android
          script: PRINTLY_DISPOSABLE_EMULATOR=1 bash ci-notification-permission-check.sh
