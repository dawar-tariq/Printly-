# Temporary isolated-QA check. This makes no FCM delivery and prints no secrets.
name: Validate isolated QA Firebase without delivery

on:
  push:
    branches:
      - 'arena/309fdf51-printly'
    paths:
      - '.github/workflows/qa-notification-prerequisites.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'dawar-tariq/Printly-' && github.ref == 'refs/heads/arena/309fdf51-printly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify isolation, authorization, OAuth and FCM validation-only
        env:
          QA_WORKER_SECRET: ${{ secrets.PRINTLY_QA_CRON_E54FF1CB5D3D }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const site = 'https://printly-native-test.vercel.app';
          const expectedDb = 'https://rahfmpsdbwbktlobntkm.supabase.co';
          const secret = process.env.QA_WORKER_SECRET || '';
          const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
          if (!/^[A-Za-z0-9_-]{32,128}$/.test(secret)) fail('QA worker key is missing or invalid in GitHub Actions.');
          try {
            const response = await fetch(`${site}/api/native/v1/test-environment`, { redirect: 'error', signal: AbortSignal.timeout(15000) });
            const result = await response.json();
            if (!response.ok || result.isolated_test !== true || result.supabase_url !== expectedDb || result.public_auth_check !== 'ok' || result.server_database_read !== 'ok') fail('QA isolation check failed.');
          } catch { fail('Could not confirm isolated QA environment.'); }
          const url = `${site}/api/cron/native-qa-phone-test`;
          const wrong = `${secret[0] === 'A' ? 'B' : 'A'}${secret.slice(1)}`;
          try {
            // The isolated deployment can still be building when this job starts.
            // Only a 404 is retried; the live diagnostic must reject a wrong key.
            let deniedStatus = 404;
            const deadline = Date.now() + 3 * 60 * 1000;
            while (Date.now() < deadline && deniedStatus === 404) {
              const denied = await fetch(url, { headers: { Authorization: `Bearer ${wrong}` }, redirect: 'error', signal: AbortSignal.timeout(15000) });
              deniedStatus = denied.status;
              if (deniedStatus === 404) await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            if (deniedStatus !== 401) fail(`Unauthorized diagnostic returned HTTP ${deniedStatus}, expected 401.`);
            const response = await fetch(url, { headers: { Authorization: `Bearer ${secret}` }, redirect: 'error', signal: AbortSignal.timeout(30000) });
            const result = await response.json();
            if (!response.ok) {
              if (result?.error?.message === 'Test notification service is not configured.') fail('QA server key or feature flag is not valid.');
              if (result?.error?.message === 'Test notification authorization is unavailable.') fail('QA Firebase OAuth authorization failed.');
              if (result?.oauth === 'ok' && result?.validation === 'failed' && Number.isInteger(result.fcm_http_status)) fail(`QA OAuth succeeded, but FCM validation-only failed (HTTP ${result.fcm_http_status}; 0 means network failure).`);
              fail(`QA diagnostic failed (HTTP ${response.status}).`);
            }
            if (result.oauth !== 'ok' || result.validation !== 'ok' || result.fcm_http_status !== 200) fail('Unexpected QA diagnostic result.');
            console.log('PASS: isolated QA, access control, Firebase OAuth, and FCM validation-only. No notification was delivered.');
          } catch { fail('Could not run the isolated QA validation securely.'); }
          NODE
