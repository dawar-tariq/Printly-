# TEMPORARY: a single, user-approved, isolated-QA phone test. No scheduler.
name: Send one isolated QA phone notification

on:
  push:
    branches:
      - 'arena/309fdf51-printly'
    paths:
      - '.github/workflows/qa-notification-prerequisites.yml'

permissions:
  contents: read

concurrency:
  group: isolated-qa-phone-c47d26a6-one-shot
  cancel-in-progress: false

jobs:
  send-once:
    if: github.repository == 'dawar-tariq/Printly-' && github.ref == 'refs/heads/arena/309fdf51-printly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify isolation and make one dispatch request
        id: dispatch
        env:
          QA_WORKER_SECRET: ${{ secrets.PRINTLY_QA_CRON_E54FF1CB5D3D }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const site = 'https://printly-native-test.vercel.app';
          const expectedDb = 'https://rahfmpsdbwbktlobntkm.supabase.co';
          const secret = process.env.QA_WORKER_SECRET || '';
          const finish = (category, status = 0) => {
            appendFileSync(process.env.GITHUB_OUTPUT, `category=${category}\nstatus=${status}\n`);
            console.log(`QA test result: ${category}; no secret or device information is logged.`);
          };
          let dispatchStarted = false;
          try {
            if (!/^[A-Za-z0-9_-]{32,128}$/.test(secret)) { finish('not_sent'); process.exit(0); }
            const diagnostic = await fetch(`${site}/api/native/v1/test-environment`, { redirect: 'error', signal: AbortSignal.timeout(15000) });
            const isolation = await diagnostic.json();
            if (!diagnostic.ok || isolation.isolated_test !== true || isolation.supabase_url !== expectedDb || isolation.public_auth_check !== 'ok' || isolation.server_database_read !== 'ok') {
              finish('not_sent'); process.exit(0);
            }
            const url = `${site}/api/cron/native-qa-phone-test`;
            const headers = { Authorization: `Bearer ${secret}` };
            const preflight = await fetch(url, { headers, redirect: 'error', signal: AbortSignal.timeout(30000) });
            const validation = await preflight.json();
            if (!preflight.ok || validation.oauth !== 'ok' || validation.validation !== 'ok') { finish('not_sent'); process.exit(0); }
            // Exactly one POST. A timeout or unrecognized response is ambiguous:
            // do not repeat it, even if the GitHub job itself is retried.
            dispatchStarted = true;
            const response = await fetch(url, { method: 'POST', headers, redirect: 'error', signal: AbortSignal.timeout(55000) });
            const result = await response.json();
            if (result?.attempted === true && result.fcm_result === 'sent') {
              finish(result.recorded === true ? 'accepted' : 'accepted_unconfirmed');
            } else if (result?.attempted === false && result.validation === 'failed') {
              finish('validation_failed', Number.isInteger(result.fcm_http_status) ? result.fcm_http_status : 0);
            } else if (result?.attempted === true) {
              finish(result.fcm_result === 'gone' ? 'unregistered' : 'send_uncertain');
            } else if (response.status === 409 || [401, 404].includes(response.status) ||
              ['Test notification service is not configured.', 'Test notification authorization is unavailable.', 'Test delivery is unavailable.', 'No eligible one-time test delivery.'].includes(result?.error?.message)) {
              finish('not_sent');
            } else { finish('send_uncertain'); }
          } catch { finish(dispatchStarted ? 'send_uncertain' : 'not_sent'); }
          NODE
      - name: FCM accepted the one QA message
        if: steps.dispatch.outputs.category == 'accepted'
        run: echo 'FCM accepted one message; phone display still requires confirmation.'
      - name: FCM accepted but database acknowledgement was unconfirmed
        if: steps.dispatch.outputs.category == 'accepted_unconfirmed'
        run: echo 'Do not retry; ask the phone user and inspect the one-shot record.'
      - name: 'FCM validation failed (HTTP ${{ steps.dispatch.outputs.status }}); no live message'
        if: steps.dispatch.outputs.category == 'validation_failed'
        run: echo 'The validation-only request failed; no live message was sent.'
      - name: FCM reports the QA installation is unregistered
        if: steps.dispatch.outputs.category == 'unregistered'
        run: echo 'The phone registration needs attention; the test is not requeued.'
      - name: Dispatch result uncertain; do not retry
        if: steps.dispatch.outputs.category == 'send_uncertain'
        run: echo 'A send may have been accepted; do not issue another request.'
      - name: Preflight blocked the dispatch
        if: steps.dispatch.outputs.category == 'not_sent'
        run: echo 'No live dispatch was made.'
      - name: Mark any unconfirmed outcome as needing attention
        if: steps.dispatch.outputs.category != 'accepted'
        run: exit 1
