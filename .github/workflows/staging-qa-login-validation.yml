# Temporary, isolated synthetic login verification; no FCM send or production access.
name: Verify staging QA phone login

on:
  push:
    paths:
      - '.github/workflows/staging-qa-login-validation.yml'

permissions:
  contents: read

jobs:
  synthetic-login:
    if: github.repository == 'dawar-tariq/Printly-' && github.ref == 'refs/heads/arena/309fdf51-printly'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned Supabase client
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/printly-qa-login-deps" --no-save --ignore-scripts --no-audit --no-fund @supabase/supabase-js@2.119.1
      - name: Start isolated listener with a temporary encryption key
        id: listener
        shell: bash
        run: |
          set -euo pipefail
          export PRINTLY_QA_LOGIN_CHECK=1
          export PRINTLY_QA_LOGIN_DIR="$RUNNER_TEMP/printly-qa-login"
          export GNUPGHOME="$PRINTLY_QA_LOGIN_DIR/gpg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$PRINTLY_QA_LOGIN_DIR" "$GNUPGHOME"
          printf 'PRINTLY_QA_LOGIN_DIR=%s\nGNUPGHOME=%s\n' "$PRINTLY_QA_LOGIN_DIR" "$GNUPGHOME" >> "$GITHUB_ENV"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key 'Printly QA synthetic login <qa-login@example.invalid>' rsa2048 sign 0 >/dev/null 2>&1
          fingerprint=$(gpg --batch --with-colons --list-keys 'qa-login@example.invalid' 2>/dev/null | awk -F: '$1 == "fpr" {print $10; exit}')
          test -n "$fingerprint"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-add-key "$fingerprint" rsa2048 encr 0 >/dev/null 2>&1
          gpg --batch --armor --export 'qa-login@example.invalid' > "$PRINTLY_QA_LOGIN_DIR/public.asc"
          node scripts/staging-qa-login-validation.mjs > "$PRINTLY_QA_LOGIN_DIR/probe.log" 2>&1 &
          echo "$!" > "$PRINTLY_QA_LOGIN_DIR/pid"
          for i in $(seq 1 120); do
            if [ -f "$PRINTLY_QA_LOGIN_DIR/failed" ]; then cat "$PRINTLY_QA_LOGIN_DIR/failed"; exit 1; fi
            if [ -f "$PRINTLY_QA_LOGIN_DIR/listening" ]; then break; fi
            if ! kill -0 "$(cat "$PRINTLY_QA_LOGIN_DIR/pid")" 2>/dev/null; then echo 'Listener stopped.'; exit 1; fi
            sleep 1
          done
          test -f "$PRINTLY_QA_LOGIN_DIR/listening"
          public=$(base64 -w0 "$PRINTLY_QA_LOGIN_DIR/public.asc")
          test "${#public}" -le 2880
          for i in $(seq 1 16); do
            offset=$(( (i - 1) * 180 ))
            printf 'part%s=%s\n' "$i" "${public:offset:180}" >> "$GITHUB_OUTPUT"
          done
      - name: "Runner public key part 01 ${{ steps.listener.outputs.part1 }}"
        run: ":"
      - name: "Runner public key part 02 ${{ steps.listener.outputs.part2 }}"
        run: ":"
      - name: "Runner public key part 03 ${{ steps.listener.outputs.part3 }}"
        run: ":"
      - name: "Runner public key part 04 ${{ steps.listener.outputs.part4 }}"
        run: ":"
      - name: "Runner public key part 05 ${{ steps.listener.outputs.part5 }}"
        run: ":"
      - name: "Runner public key part 06 ${{ steps.listener.outputs.part6 }}"
        run: ":"
      - name: "Runner public key part 07 ${{ steps.listener.outputs.part7 }}"
        run: ":"
      - name: "Runner public key part 08 ${{ steps.listener.outputs.part8 }}"
        run: ":"
      - name: "Runner public key part 09 ${{ steps.listener.outputs.part9 }}"
        run: ":"
      - name: "Runner public key part 10 ${{ steps.listener.outputs.part10 }}"
        run: ":"
      - name: "Runner public key part 11 ${{ steps.listener.outputs.part11 }}"
        run: ":"
      - name: "Runner public key part 12 ${{ steps.listener.outputs.part12 }}"
        run: ":"
      - name: "Runner public key part 13 ${{ steps.listener.outputs.part13 }}"
        run: ":"
      - name: "Runner public key part 14 ${{ steps.listener.outputs.part14 }}"
        run: ":"
      - name: "Runner public key part 15 ${{ steps.listener.outputs.part15 }}"
        run: ":"
      - name: "Runner public key part 16 ${{ steps.listener.outputs.part16 }}"
        run: ":"
      - name: Validate the new synthetic login and shop
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            if [ -f "$PRINTLY_QA_LOGIN_DIR/failed" ]; then cat "$PRINTLY_QA_LOGIN_DIR/failed"; exit 1; fi
            if [ -f "$PRINTLY_QA_LOGIN_DIR/passed" ]; then echo 'PASS: isolated Auth, native shop, temporary entitlement, and sign-out.'; exit 0; fi
            if ! kill -0 "$(cat "$PRINTLY_QA_LOGIN_DIR/pid")" 2>/dev/null; then echo 'Listener stopped.'; exit 1; fi
            sleep 1
          done
          echo 'Timed out waiting for synthetic login verification.'
          exit 1
      - name: Read encrypted credential for the operator
        id: ciphertext
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "${PRINTLY_QA_LOGIN_DIR:-/nonexistent}/local.cipher" ]; then
            ciphertext=$(tr -d '\r\n' < "$PRINTLY_QA_LOGIN_DIR/local.cipher")
            test "${#ciphertext}" -le 1440
            printf 'available=1\n' >> "$GITHUB_OUTPUT"
            for i in $(seq 1 8); do
              offset=$(( (i - 1) * 180 ))
              printf 'part%s=%s\n' "$i" "${ciphertext:offset:180}" >> "$GITHUB_OUTPUT"
            done
          fi
      - name: "QA encrypted password part 01 ${{ steps.ciphertext.outputs.part1 }}"
        if: always() && steps.ciphertext.outputs.available == '1'
        run: ":"
      - name: "QA encrypted password part 02 ${{ steps.ciphertext.outputs.part2 }}"
        if: always() && steps.ciphertext.outputs.available == '1'
        run: ":"
      - name: "QA encrypted password part 03 ${{ steps.ciphertext.outputs.part3 }}"
        if: always() && steps.ciphertext.outputs.available == '1'
        run: ":"
      - name: "QA encrypted password part 04 ${{ steps.ciphertext.outputs.part4 }}"
        if: always() && steps.ciphertext.outputs.available == '1'
        run: ":"
      - name: "QA encrypted password part 05 ${{ steps.ciphertext.outputs.part5 }}"
        if: always() && steps.ciphertext.outputs.available == '1'
        run: ":"
      - name: "QA encrypted password part 06 ${{ steps.ciphertext.outputs.part6 }}"
        if: always() && steps.ciphertext.outputs.available == '1'
        run: ":"
      - name: "QA encrypted password part 07 ${{ steps.ciphertext.outputs.part7 }}"
        if: always() && steps.ciphertext.outputs.available == '1'
        run: ":"
      - name: "QA encrypted password part 08 ${{ steps.ciphertext.outputs.part8 }}"
        if: always() && steps.ciphertext.outputs.available == '1'
        run: ":"
      - name: Remove the temporary runner key and listener
        if: always()
        shell: bash
        run: |
          if [ -n "${PRINTLY_QA_LOGIN_DIR:-}" ] && [ -f "$PRINTLY_QA_LOGIN_DIR/pid" ]; then kill "$(cat "$PRINTLY_QA_LOGIN_DIR/pid")" 2>/dev/null || true; fi
          if [ -n "${GNUPGHOME:-}" ]; then gpgconf --kill all >/dev/null 2>&1 || true; fi
          if [ -n "${PRINTLY_QA_LOGIN_DIR:-}" ]; then rm -rf -- "$PRINTLY_QA_LOGIN_DIR"; fi
