name: Android debug build

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/printly-owner-android/**'
      - 'scripts/create-owner-signing-key.sh'
      - 'scripts/encrypt-android-review.sh'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          result=${PIPESTATUS[1]}
          set -o pipefail
          test "$result" -eq 0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Refuse an unsigned release
        working-directory: apps/printly-owner-android
        shell: bash
        run: |
          if ./gradlew --no-daemon assembleRelease > release-check.txt 2>&1; then
            echo 'A release build succeeded without configured release signing.' >&2
            exit 1
          fi
          grep -F 'Release signing is not configured' release-check.txt
      - name: Verify release signing with disposable CI keys
        working-directory: apps/printly-owner-android
        shell: bash
        run: |
          set -eu -o pipefail
          # Neither test key nor release APK is uploaded or used for distribution.
          trap 'rm -f "$RUNNER_TEMP/printly-ci-PKCS12.keystore" "$RUNNER_TEMP/printly-ci-JKS.keystore"' EXIT
          for STORETYPE in PKCS12 JKS; do
            KEYSTORE="$RUNNER_TEMP/printly-ci-$STORETYPE.keystore"
            keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storetype "$STORETYPE" \
              -storepass ci-test-only -keypass ci-test-only -alias ci-test \
              -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=Disposable CI Test'
            PRINTLY_ANDROID_KEYSTORE_PATH="$KEYSTORE" PRINTLY_ANDROID_KEYSTORE_PASSWORD=ci-test-only \
              PRINTLY_ANDROID_KEYSTORE_TYPE="$STORETYPE" PRINTLY_ANDROID_KEY_ALIAS=ci-test PRINTLY_ANDROID_KEY_PASSWORD=ci-test-only \
              ./gradlew --no-daemon assembleRelease
            RELEASE=app/build/outputs/apk/release/app-release.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RELEASE" > ci-signer.txt
            mapfile -t signers < <(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' ci-signer.txt)
            test "${#signers[@]}" -eq 1
            actual=$(printf '%s' "${signers[0]}" | tr -d ':' | tr '[:upper:]' '[:lower:]')
            expected=$(keytool -list -v -keystore "$KEYSTORE" -storetype "$STORETYPE" -storepass ci-test-only -alias ci-test | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            test "$actual" = "$expected"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$RELEASE" | grep -F "package: name='io.github.dawartariq.printly.owner'"
          done
      - name: Verify a disposable OpenSSL-generated Android signing key
        working-directory: apps/printly-owner-android
        shell: bash
        run: |
          set -eu -o pipefail
          VAULT="$RUNNER_TEMP/printly-disposable-owner-key"
          trap 'rm -rf "$VAULT"' EXIT
          ../../scripts/create-owner-signing-key.sh "$VAULT"
          test "$(stat -c '%a' "$VAULT")" = 700
          test "$(stat -c '%a' "$VAULT/keystore-password.txt")" = 600
          test ! -e "$VAULT/encrypted-private-key.pem"
          export PRINTLY_ANDROID_KEYSTORE_PATH="$VAULT/printly-owner-release.p12"
          export PRINTLY_ANDROID_KEYSTORE_TYPE=PKCS12
          export PRINTLY_ANDROID_KEYSTORE_PASSWORD
          PRINTLY_ANDROID_KEYSTORE_PASSWORD=$(cat "$VAULT/keystore-password.txt")
          export PRINTLY_ANDROID_KEY_ALIAS=printly-owner-release
          export PRINTLY_ANDROID_KEY_PASSWORD="$PRINTLY_ANDROID_KEYSTORE_PASSWORD"
          keytool -list -keystore "$PRINTLY_ANDROID_KEYSTORE_PATH" -storetype PKCS12 -storepass:env PRINTLY_ANDROID_KEYSTORE_PASSWORD -alias "$PRINTLY_ANDROID_KEY_ALIAS" > /dev/null
          ./gradlew --no-daemon assembleRelease
          RELEASE=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RELEASE" > ci-openssl-signer.txt
          mapfile -t signers < <(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' ci-openssl-signer.txt)
          test "${#signers[@]}" -eq 1
          actual=$(printf '%s' "${signers[0]}" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          expected=$(openssl x509 -in "$VAULT/certificate.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          test "$actual" = "$expected"
          unset PRINTLY_ANDROID_KEYSTORE_PASSWORD PRINTLY_ANDROID_KEY_PASSWORD
      - name: Verify encrypted review artifacts with disposable data
        working-directory: apps/printly-owner-android
        shell: bash
        env:
          PRINTLY_ANDROID_ARTIFACT_PASSPHRASE: 'disposable-ci-only-passphrase-not-a-secret'
        run: |
          set -eu -o pipefail
          RELEASE=app/build/outputs/apk/release/app-release.apk
          ENCRYPTED="$RUNNER_TEMP/printly-ci-review.apk.gpg"
          DECRYPTED="$RUNNER_TEMP/printly-ci-review-decrypted.apk"
          TAMPERED="$RUNNER_TEMP/printly-ci-review-tampered.gpg"
          export GNUPGHOME="$RUNNER_TEMP/printly-ci-gpg"
          mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"; rm -f "$ENCRYPTED" "$DECRYPTED" "$TAMPERED"' EXIT
          ../../scripts/encrypt-android-review.sh "$RELEASE" "$ENCRYPTED"
          printf '%s\n' "$PRINTLY_ANDROID_ARTIFACT_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --no-symkey-cache --passphrase-fd 0 --output "$DECRYPTED" --decrypt "$ENCRYPTED"
          cmp "$RELEASE" "$DECRYPTED"
          cp "$ENCRYPTED" "$TAMPERED"
          python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]); b=bytearray(p.read_bytes()); b[-5] ^= 1; p.write_bytes(b)' "$TAMPERED"
          if printf '%s\n' "$PRINTLY_ANDROID_ARTIFACT_PASSPHRASE" | gpg --batch --pinentry-mode loopback --no-symkey-cache --passphrase-fd 0 --decrypt "$TAMPERED" > /dev/null 2>&1; then
            echo 'A tampered encrypted artifact unexpectedly decrypted successfully.' >&2; exit 1
          fi
          if PRINTLY_ANDROID_ARTIFACT_PASSPHRASE=short ../../scripts/encrypt-android-review.sh "$RELEASE" "$TAMPERED"; then
            echo 'A short artifact passphrase was unexpectedly accepted.' >&2; exit 1
          fi
      - name: Build a debug-signed test APK
        working-directory: apps/printly-owner-android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug --stacktrace > build-log.txt 2>&1
          result=$?
          cat build-log.txt
          if [ "$result" -ne 0 ]; then
            grep -E '(^FAILURE:|^\* What went wrong|^> |^   > |error:|^Caused by:)' build-log.txt | head -8 | while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error title=Android build::$line"
            done
          fi
          exit "$result"
      - name: Inspect the debug package
        working-directory: apps/printly-owner-android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > manifest.txt
          grep -E 'android:pathPrefix[^=]*="/shop/"' manifest.txt
          grep -E 'android:path[^=]*="/shop"' manifest.txt
          grep -E 'android:path[^=]*="/owner-app"' manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | tee certificate.txt
          sha256sum "$APK" | tee sha256.txt
          echo "::notice title=Debug package::$(head -n1 badging.txt)"
          echo "::notice title=Debug certificate SHA-256::$(grep -m1 'certificate SHA-256 digest' certificate.txt)"
          echo "::notice title=Debug APK SHA-256::$(cut -d' ' -f1 sha256.txt)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: printly-owner-debug-not-for-release
          path: apps/printly-owner-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
