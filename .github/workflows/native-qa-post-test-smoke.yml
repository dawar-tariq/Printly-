# TEMPORARY: read-only verification after the one-off QA notification.
# All requests are GET; this workflow cannot queue or dispatch a message.
name: Verify isolated QA notification cleanup

on:
  push:
    branches: ['arena/309fdf51-printly']
    paths: ['.github/workflows/native-qa-post-test-smoke.yml']

permissions: {}

jobs:
  verify-cleanup:
    if: github.repository == 'dawar-tariq/Printly-' && github.ref == 'refs/heads/arena/309fdf51-printly'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the isolated host, removed route and disabled worker
        env:
          QA_WORKER_SECRET: ${{ secrets.PRINTLY_QA_CRON_E54FF1CB5D3D }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const site = 'https://printly-native-test.vercel.app';
          const expectedDb = 'https://rahfmpsdbwbktlobntkm.supabase.co';
          const secret = process.env.QA_WORKER_SECRET || '';
          const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
          if (!/^[A-Za-z0-9_-]{32,128}$/.test(secret)) fail('QA authorization is not configured.');
          const wrong = `${secret[0] === 'A' ? 'B' : 'A'}${secret.slice(1)}`;
          const request = (path, headers = {}) => fetch(site + path, { headers, redirect: 'error', signal: AbortSignal.timeout(15000) });
          try {
            const isolation = await request('/api/native/v1/test-environment');
            const diagnostic = await isolation.json();
            if (!isolation.ok || diagnostic.isolated_test !== true || diagnostic.supabase_url !== expectedDb || diagnostic.public_auth_check !== 'ok' || diagnostic.server_database_read !== 'ok') fail('Isolated staging verification failed.');
            const removed = await request('/api/cron/native-qa-managed-test', { authorization: `Bearer ${wrong}` });
            if (removed.status !== 404) fail(`The temporary QA route returned HTTP ${removed.status}, not 404.`);
            const release = await request('/api/native/v1/app-release');
            const feed = await release.json();
            if (!release.ok || JSON.stringify(feed) !== JSON.stringify({ available: false })) fail('The isolated feed must remain empty.');
            const gateway = await request('/api/native/v1/shop/me');
            if (gateway.status !== 401) fail(`Anonymous native shop access returned HTTP ${gateway.status}.`);
            const admin = await request('/api/admin/notifications?view=overview');
            if (admin.status !== 403) fail(`Anonymous notification administration returned HTTP ${admin.status}.`);
            const unauth = await request('/api/cron/native-order-push');
            if (unauth.status !== 401) fail(`Anonymous worker access returned HTTP ${unauth.status}.`);
            const stopped = await request('/api/cron/native-order-push', { authorization: `Bearer ${secret}` });
            if (stopped.status !== 503) fail(`The isolated worker should be disabled but returned HTTP ${stopped.status}.`);
            console.log('PASS: the isolated host is correct, the one-shot route is removed, and the normal worker is disabled. No message was sent.');
          } catch { fail('Could not complete the isolated no-send cleanup smoke.'); }
          NODE
