# Temporary read-only smoke for the isolated test project. It does not queue or
# send a notification, change application data, or install a scheduler.
name: Verify isolated QA v2 without delivery

on:
  push:
    branches: ['arena/309fdf51-printly']
    paths: ['.github/workflows/native-qa-v2-no-send-smoke.yml']

permissions: {}

jobs:
  no-send-smoke:
    if: github.repository == 'dawar-tariq/Printly-' && github.ref == 'refs/heads/arena/309fdf51-printly'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check staging isolation, release feed and disabled worker
        env:
          QA_WORKER_SECRET: ${{ secrets.PRINTLY_QA_CRON_E54FF1CB5D3D }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const site = 'https://printly-native-test.vercel.app';
          const expectedDb = 'https://rahfmpsdbwbktlobntkm.supabase.co';
          const secret = process.env.QA_WORKER_SECRET || '';
          const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
          if (!/^[A-Za-z0-9_-]{32,128}$/.test(secret)) fail('QA authorization is not configured.');
          const wrong = `${secret[0] === 'A' ? 'B' : 'A'}${secret.slice(1)}`;
          const request = (path, init = {}) => fetch(site + path, { ...init, redirect: 'manual', signal: AbortSignal.timeout(15000) });
          try {
            // Wait until the final deployment has removed the temporary source
            // transport. A wrong bearer cannot stage anything while waiting.
            let status = 401;
            const deadline = Date.now() + 7 * 60 * 1000;
            while (Date.now() < deadline && status !== 404) {
              try { status = (await request('/api/native/v1/qa-migration-source', { method: 'POST', headers: { authorization: `Bearer ${wrong}` } })).status; }
              catch { status = 503; }
              if (status !== 404) await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            if (status !== 404) fail('The temporary source transport is still reachable.');
            const isolation = await request('/api/native/v1/test-environment');
            const diagnostic = await isolation.json();
            if (!isolation.ok || diagnostic.isolated_test !== true || diagnostic.supabase_url !== expectedDb || diagnostic.public_auth_check !== 'ok' || diagnostic.server_database_read !== 'ok') fail('Isolated staging verification failed.');
            const release = await request('/api/native/v1/app-release');
            const feed = await release.json();
            if (!release.ok || JSON.stringify(feed) !== JSON.stringify({ available: false })) fail('The isolated feed must not advertise a production APK.');
            const gateway = await request('/api/native/v1/shop/me');
            if (gateway.status !== 401) fail(`Anonymous native shop access returned HTTP ${gateway.status}.`);
            const admin = await request('/api/admin/notifications?view=overview');
            if (admin.status !== 403) fail(`Anonymous notification administration returned HTTP ${admin.status}.`);
            const noAuth = await request('/api/cron/native-order-push');
            if (noAuth.status !== 401) fail(`Anonymous worker access returned HTTP ${noAuth.status}.`);
            // The staging database also denies both claim RPCs, so even an
            // incorrectly configured route cannot claim or send a delivery.
            const stopped = await request('/api/cron/native-order-push', { headers: { authorization: `Bearer ${secret}` } });
            if (stopped.status !== 503) fail(`The isolated worker was expected to be disabled, but returned HTTP ${stopped.status}.`);
            console.log('PASS: final QA host and staging backend verified; test feed is empty; anonymous access is denied; authorized worker is disabled. No notification was sent.');
          } catch { fail('Could not complete the isolated no-send smoke.'); }
          NODE
