# Temporary staged synthetic-only test. No APK, FCM credentials or production
# services are used. The operator removes the fixture after the job completes.
name: Verify staged native Realtime

on:
  push:
    paths:
      - '.github/workflows/staging-realtime-probe.yml'

permissions:
  contents: read

jobs:
  synthetic-realtime:
    if: github.repository == 'dawar-tariq/Printly-' && github.ref == 'refs/heads/arena/309fdf51-printly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the pinned Realtime client
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/printly-staging-probe-deps" --no-save --ignore-scripts --no-audit --no-fund @supabase/supabase-js@2.119.1
      - name: Start isolated synthetic listeners
        id: listener
        shell: bash
        run: |
          set -euo pipefail
          export PRINTLY_STAGING_REALTIME_PROBE=1
          export PRINTLY_STAGING_PROBE_DIR="$RUNNER_TEMP/printly-staging-probe"
          export GNUPGHOME="$PRINTLY_STAGING_PROBE_DIR/gpg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$PRINTLY_STAGING_PROBE_DIR" "$GNUPGHOME"
          printf 'PRINTLY_STAGING_PROBE_DIR=%s\nGNUPGHOME=%s\n' "$PRINTLY_STAGING_PROBE_DIR" "$GNUPGHOME" >> "$GITHUB_ENV"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key 'Printly Synthetic Probe <synthetic-probe@example.invalid>' rsa2048 sign 0 >/dev/null 2>&1
          fingerprint=$(gpg --batch --with-colons --list-keys 'synthetic-probe@example.invalid' 2>/dev/null | awk -F: '$1 == "fpr" {print $10; exit}')
          test -n "$fingerprint"
          # PostgreSQL pgcrypto expects an encryption subkey, not only a primary key.
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-add-key "$fingerprint" rsa2048 encr 0 >/dev/null 2>&1
          gpg --batch --armor --export 'synthetic-probe@example.invalid' > "$PRINTLY_STAGING_PROBE_DIR/public.asc"
          test -s "$PRINTLY_STAGING_PROBE_DIR/public.asc"
          node scripts/staging-realtime-probe.mjs > "$PRINTLY_STAGING_PROBE_DIR/probe.log" 2>&1 &
          echo "$!" > "$PRINTLY_STAGING_PROBE_DIR/pid"
          for i in $(seq 1 120); do
            if [ -f "$PRINTLY_STAGING_PROBE_DIR/failed" ]; then cat "$PRINTLY_STAGING_PROBE_DIR/failed"; exit 1; fi
            if [ -f "$PRINTLY_STAGING_PROBE_DIR/listening" ]; then break; fi
            if ! kill -0 "$(cat "$PRINTLY_STAGING_PROBE_DIR/pid")" 2>/dev/null; then echo 'Synthetic listener stopped.'; exit 1; fi
            sleep 1
          done
          test -f "$PRINTLY_STAGING_PROBE_DIR/listening"
          # Only the public key is exposed in the next step names. Private key
          # and login material stay on the runner and are never printed.
          public_key=$(base64 -w 0 "$PRINTLY_STAGING_PROBE_DIR/public.asc")
          test "${#public_key}" -le 2880
          for i in $(seq 1 16); do
            offset=$(( (i - 1) * 180 ))
            printf 'part%s=%s\n' "$i" "${public_key:offset:180}" >> "$GITHUB_OUTPUT"
          done
      - name: "Public key part 01 ${{ steps.listener.outputs.part1 }}"
        run: ':'
      - name: "Public key part 02 ${{ steps.listener.outputs.part2 }}"
        run: ':'
      - name: "Public key part 03 ${{ steps.listener.outputs.part3 }}"
        run: ':'
      - name: "Public key part 04 ${{ steps.listener.outputs.part4 }}"
        run: ':'
      - name: "Public key part 05 ${{ steps.listener.outputs.part5 }}"
        run: ':'
      - name: "Public key part 06 ${{ steps.listener.outputs.part6 }}"
        run: ':'
      - name: "Public key part 07 ${{ steps.listener.outputs.part7 }}"
        run: ':'
      - name: "Public key part 08 ${{ steps.listener.outputs.part8 }}"
        run: ':'
      - name: "Public key part 09 ${{ steps.listener.outputs.part9 }}"
        run: ':'
      - name: "Public key part 10 ${{ steps.listener.outputs.part10 }}"
        run: ':'
      - name: "Public key part 11 ${{ steps.listener.outputs.part11 }}"
        run: ':'
      - name: "Public key part 12 ${{ steps.listener.outputs.part12 }}"
        run: ':'
      - name: "Public key part 13 ${{ steps.listener.outputs.part13 }}"
        run: ':'
      - name: "Public key part 14 ${{ steps.listener.outputs.part14 }}"
        run: ':'
      - name: "Public key part 15 ${{ steps.listener.outputs.part15 }}"
        run: ':'
      - name: "Public key part 16 ${{ steps.listener.outputs.part16 }}"
        run: ':'
      - name: Wait for synthetic owner subscription
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            if [ -f "$PRINTLY_STAGING_PROBE_DIR/failed" ]; then cat "$PRINTLY_STAGING_PROBE_DIR/failed"; exit 1; fi
            if [ -f "$PRINTLY_STAGING_PROBE_DIR/owner-ready" ]; then exit 0; fi
            if ! kill -0 "$(cat "$PRINTLY_STAGING_PROBE_DIR/pid")" 2>/dev/null; then echo 'Synthetic listener stopped.'; exit 1; fi
            sleep 1
          done
          echo 'Timed out waiting for synthetic owner subscription.'
          exit 1
      - name: Verify synthetic update and isolation
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            if [ -f "$PRINTLY_STAGING_PROBE_DIR/failed" ]; then cat "$PRINTLY_STAGING_PROBE_DIR/failed"; exit 1; fi
            if [ -f "$PRINTLY_STAGING_PROBE_DIR/passed" ]; then echo 'PASS: synthetic owner update, tracking hint, and anonymous isolation.'; exit 0; fi
            if ! kill -0 "$(cat "$PRINTLY_STAGING_PROBE_DIR/pid")" 2>/dev/null; then echo 'Synthetic listener stopped.'; exit 1; fi
            sleep 1
          done
          echo 'Timed out waiting for synthetic update.'
          exit 1
      - name: Discard runner-local key and listener
        if: always()
        shell: bash
        run: |
          if [ -n "${PRINTLY_STAGING_PROBE_DIR:-}" ] && [ -f "$PRINTLY_STAGING_PROBE_DIR/pid" ]; then
            kill "$(cat "$PRINTLY_STAGING_PROBE_DIR/pid")" 2>/dev/null || true
          fi
          if [ -n "${GNUPGHOME:-}" ]; then gpgconf --kill all >/dev/null 2>&1 || true; fi
